{% block content %}
{% load static %}


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYIPLAB | Login</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f14;
      --card-bg: #11161d;
      --gold: #d4af37;
      --gold-dark: #b8962e;
      --text-light: #e5e5e5;
      --text-muted: #9aa0a6;
      --border: rgba(212, 175, 55, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #141a22, #070a0f 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-light);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #151a21, #0d1117);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .auth-container::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 16px;
      background: linear-gradient(120deg, transparent, var(--gold), transparent);
      opacity: 0.15;
      z-index: -1;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .logo span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      background: #0b0f14;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-light);
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.25);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .options a {
      color: var(--gold);
      text-decoration: none;
    }

    .options a:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .footer-text {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--gold);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-container">
    <div class="logo">
      <h1>PRIMEVEST CAPITAL</h1>
      <span>Complete PRIMEVEST CAPITAL Investment System</span>
    </div>

    <h2 class="auth-title">Login to Your Account</h2>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      {% if error %}
      <p style="color:red;">{{ error }}</p>
      {% endif %}
      <div class="form-group">
        <label>Enter username</label>
        <input type="text" placeholder="Enter your username" required name="username">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required name="password">
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button class="btn-primary" type="submit">Login</button>
    </form>

    <div class="footer-text">
      Don’t have an account? <a href="{% url 'signup' %}">Create Account</a>
    </div>
  </div>

</body>

</html>

{% endblock %}
